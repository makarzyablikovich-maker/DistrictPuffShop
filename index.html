<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DistrictPuff — Каталог</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--tg-theme-bg-color, #18181b);
      color: var(--tg-theme-text-color, #f4f4f5);
      padding: 16px 16px 90px;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--tg-theme-hint-color, #a1a1aa); margin-bottom: 16px; }
    .grid { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--tg-theme-secondary-bg-color, #27272a);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .info { flex: 1; }
    .name { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
    .flavor { font-size: 13px; color: var(--tg-theme-hint-color, #a1a1aa); margin-bottom: 6px; }
    .price { font-weight: 700; font-size: 15px; color: var(--tg-theme-button-color, #3b82f6); }
    .controls { display: flex; align-items: center; gap: 8px; }
    button.qty-btn {
      width: 32px; height: 32px;
      border-radius: 8px; border: none;
      background: var(--tg-theme-button-color, #3b82f6);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 18px; font-weight: 600; cursor: pointer;
    }
    button.qty-btn.minus { background: #3f3f46; }
    .qty-val { min-width: 20px; text-align: center; font-weight: 600; }
    .comment-box { margin-top: 20px; }
    .comment-box label { display: block; font-size: 13px; color: var(--tg-theme-hint-color, #a1a1aa); margin-bottom: 6px; }
    .comment-box input {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: var(--tg-theme-secondary-bg-color, #27272a);
      color: var(--tg-theme-text-color, #f4f4f5);
      font-size: 14px; outline: none;
    }
  </style>
</head>
<body>
  <h1>DistrictPuff</h1>
  <p class="subtitle">Выбери позиции — заказ улетит напрямую в чат</p>

  <div class="grid" id="catalog"></div>

  <div class="comment-box">
    <label for="comment">Комментарий (где и во сколько удобно забрать)</label>
    <input type="text" id="comment" placeholder="Например: сегодня после 19:00" />
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const PRODUCTS = [
      { id: 1, name: "Подгон 30мл", flavor: "Кислое яблоко • 20mg", price: 18 },
      { id: 2, name: "Подгон 30мл", flavor: "Ледяная черника • 20mg", price: 18 },
      { id: 3, name: "Husky Double Ice", flavor: "Арбуз-мята • 20mg", price: 22 },
      { id: 4, name: "Brusko 30мл", flavor: "Виноград-энергетик • 20mg", price: 16 }
    ];

    const cart = {};
    const catalogEl = document.getElementById("catalog");

    function render() {
      catalogEl.innerHTML = "";
      PRODUCTS.forEach(p => {
        const qty = cart[p.id] || 0;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="flavor">${p.flavor}</div>
            <div class="price">${p.price} BYN</div>
          </div>
          <div class="controls">
            ${qty > 0 ? `<button class="qty-btn minus" onclick="changeQty(${p.id}, -1)">−</button>
                         <span class="qty-val">${qty}</span>` : ""}
            <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
          </div>
        `;
        catalogEl.appendChild(card);
      });
      updateMainButton();
    }

    window.changeQty = function(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      render();
    };

    function getOrderData() {
      const items = [];
      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const p = PRODUCTS.find(x => x.id === Number(id));
        if (p) {
          items.push({ name: p.name, flavor: p.flavor, price: p.price, qty });
          total += p.price * qty;
        }
      }
      const comment = document.getElementById("comment").value.trim() || "Без комментария";
      return { items, total, comment };
    }

    function updateMainButton() {
      const { total } = getOrderData();
      if (total > 0) {
        tg.MainButton.setText(`Оформить заказ • ${total} BYN`);
        tg.MainButton.show();
      } else {
        tg.MainButton.hide();
      }
    }

    tg.MainButton.onClick(() => {
      const order = getOrderData();
      tg.sendData(JSON.stringify(order));
    });

    render();
  </script>
</body>
</html>
